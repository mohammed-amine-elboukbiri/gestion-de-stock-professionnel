<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Articles</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Liste des Articles</h1>

    <div th:if="${successMessage}" class="alert success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>

    <div class="nav">
        <a th:href="@{/}">Accueil</a>
    </div>

    <form method="get" th:action="@{/articles}" class="filter-form" id="filterForm" autocomplete="off">
        <div class="autocomplete-wrapper">
            <input
                    type="text"
                    id="categorieInput"
                    name="categorie"
                    placeholder="Catégorie"
                    th:value="${categorie}">
            <div id="categorieSuggestions" class="suggestions"></div>
        </div>

        <label>
            <input type="checkbox" name="critique" value="true" th:checked="${critique}">
            Stock critique
        </label>

        <button type="submit">Filtrer</button>
    </form>

    <a class="btn-link" th:href="@{/articles/new}">Ajouter un article</a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Code</th>
            <th>Désignation</th>
            <th>Catégorie</th>
            <th>Stock</th>
            <th>Seuil</th>
            <th>Prix Vente</th>
            <th>Fournisseur</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${articles}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.code}"></td>
            <td th:text="${a.designation}"></td>
            <td th:text="${a.categorie}"></td>
            <td th:text="${a.stock}"></td>
            <td th:text="${a.seuilAlerte}"></td>
            <td th:text="${a.prixVente}"></td>
            <td th:text="${a.fournisseur != null ? a.fournisseur.nom : 'Aucun'}"></td>
            <td>
                <a th:href="@{/articles/edit/{id}(id=${a.id})}" class="btn-action btn-edit">Modifier</a>

                <a th:href="@{/articles/delete/{id}(id=${a.id})}"
                   class="btn-action btn-delete"
                   onclick="return confirm('Supprimer cet article ?')">Supprimer</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script th:inline="javascript">
    const categories = /*[[${categories}]]*/ [];
    const input = document.getElementById('categorieInput');
    const suggestionsBox = document.getElementById('categorieSuggestions');
    const form = document.getElementById('filterForm');

    function afficherSuggestions(valeur) {
        suggestionsBox.innerHTML = '';

        const texte = valeur.trim().toLowerCase();

        if (texte.length === 0) {
            suggestionsBox.style.display = 'none';
            return;
        }

        const resultats = categories.filter(categorie =>
            categorie.toLowerCase().includes(texte)
        );

        if (resultats.length === 0) {
            suggestionsBox.style.display = 'none';
            return;
        }

        resultats.forEach(categorie => {
            const item = document.createElement('div');
            item.className = 'suggestion-item';
            item.textContent = categorie;

            item.addEventListener('click', () => {
                input.value = categorie;
                suggestionsBox.innerHTML = '';
                suggestionsBox.style.display = 'none';
                form.submit();
            });

            suggestionsBox.appendChild(item);
        });

        suggestionsBox.style.display = 'block';
    }

    input.addEventListener('input', function () {
        afficherSuggestions(this.value);
    });

    input.addEventListener('focus', function () {
        afficherSuggestions(this.value);
    });

    document.addEventListener('click', function (e) {
        if (!e.target.closest('.autocomplete-wrapper')) {
            suggestionsBox.style.display = 'none';
        }
    });
</script>
</body>
</html>
